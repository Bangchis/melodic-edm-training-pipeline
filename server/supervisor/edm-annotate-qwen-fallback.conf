[program:edm-annotate-qwen-fallback]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/edm-annotate-qwen-fallback.sh
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/edm-annotate-qwen-fallback.log
redirect_stderr=true
stdout_logfile_maxbytes=0
