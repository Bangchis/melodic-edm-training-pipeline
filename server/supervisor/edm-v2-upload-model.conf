[program:edm-v2-upload-model]
command=/bin/bash /workspace/melodic_edm_training_pipeline/server/supervisor/edm-v2-upload-model.sh
directory=/workspace/melodic_edm_training_pipeline
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/edm-v2-upload-model.log
redirect_stderr=true
stdout_logfile_maxbytes=0
environment=HOME="/root",PYTHONUNBUFFERED="1"
