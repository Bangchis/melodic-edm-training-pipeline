[program:edm-package-release]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/edm-package-release.sh
autostart=false
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/edm-package-release.log
redirect_stderr=true
stdout_logfile_maxbytes=0
