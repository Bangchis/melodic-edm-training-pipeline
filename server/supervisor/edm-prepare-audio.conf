[program:edm-prepare-audio]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/edm-prepare-audio.sh
autostart=false
autorestart=false
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/portal/edm-prepare-audio.log
redirect_stderr=true
stdout_logfile_maxbytes=0
