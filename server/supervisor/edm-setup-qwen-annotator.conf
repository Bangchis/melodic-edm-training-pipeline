[program:edm-setup-qwen-annotator]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/edm-setup-qwen-annotator.sh
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/portal/edm-setup-qwen-annotator.log
redirect_stderr=true
stdout_logfile_maxbytes=0
