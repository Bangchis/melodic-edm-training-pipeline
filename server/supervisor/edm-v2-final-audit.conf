[program:edm-v2-final-audit]
environment=PROC_NAME="%(program_name)s"
command=/bin/bash /workspace/melodic_edm_training_pipeline/server/supervisor/edm-v2-final-audit.sh
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/portal/edm-v2-final-audit.log
redirect_stderr=true
stdout_logfile_maxbytes=0
