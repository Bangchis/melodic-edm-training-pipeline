[program:edm-v2-moss-1]
environment=PROC_NAME="%(program_name)s",GPU_INDEX="1",SHARD_INDEX="1",NUM_SHARDS="2"
command=/opt/supervisor-scripts/edm-v2-annotate-moss.sh
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/var/log/portal/edm-v2-moss-1.log
redirect_stderr=true
stdout_logfile_maxbytes=0
