[program:edm-v2-moss-smoke]
environment=PROC_NAME="%(program_name)s",GPU_INDEX="0",SHARD_INDEX="0",NUM_SHARDS="1",LIMIT="1"
command=/opt/supervisor-scripts/edm-v2-annotate-moss.sh
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/var/log/portal/edm-v2-moss-smoke.log
redirect_stderr=true
stdout_logfile_maxbytes=0
