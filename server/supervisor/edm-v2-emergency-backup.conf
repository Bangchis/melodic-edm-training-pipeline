[program:edm-v2-emergency-backup]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/edm-v2-emergency-backup.sh
autostart=false
autorestart=unexpected
startsecs=1
startretries=3
stdout_logfile=/var/log/portal/edm-v2-emergency-backup.log
redirect_stderr=true
stdout_logfile_maxbytes=0
