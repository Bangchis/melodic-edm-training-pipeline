[program:edm-v2-diagnose-base-sampling]
environment=PROC_NAME="%(program_name)s"
command=/bin/bash /workspace/melodic_edm_training_pipeline/server/supervisor/edm-v2-diagnose-base-sampling.sh
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/var/log/portal/edm-v2-diagnose-base-sampling.log
redirect_stderr=true
stdout_logfile_maxbytes=0
